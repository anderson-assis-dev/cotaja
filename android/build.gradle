buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath("com.google.gms:google-services:4.4.1")
    }
}

apply plugin: "com.facebook.react.rootproject"

// Suporte a páginas de memória de 16 KB (exigido pela Google Play para apps que
// miram Android 15+). O plugin do React Native já passa
// `-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON` para os módulos que ele configura,
// mas o `onnxruntime-react-native` compila sua glue (libonnxruntimejsi.so) com
// build CMake próprio e sai desalinhado (4 KB). Injetamos a mesma flag aqui.
subprojects { subproject ->
    if (subproject.name == "onnxruntime-react-native") {
        subproject.afterEvaluate {
            def androidExt = subproject.extensions.findByName("android")
            if (androidExt != null) {
                androidExt.defaultConfig.externalNativeBuild.cmake.arguments.add("-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON")
            }
        }
    }
}
